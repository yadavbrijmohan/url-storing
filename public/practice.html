<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .submission-form {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .submission-form h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        .submission-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .submission-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .submission-card .url {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .submission-card .url a {
            color: #667eea;
            text-decoration: none;
        }
        
        .submission-card .url a:hover {
            text-decoration: underline;
        }
        
        .submission-card .description {
            color: #555;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .submission-card .timestamp {
            color: #999;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2rem;
        }
        
        .no-submissions {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2rem;
        }
        
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-left: 15px;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
        }
        
        .stats {
            margin-top: 10px;
            color: #888;
            font-size: 0.9rem;
        }
        
        .success-message {
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📝 Submission Viewer</h1>
            <p>View and manage all your submissions</p>
        </div>
        
        <!-- Submission Form -->
        <div class="submission-form">
            <h2>Add New Submission</h2>
            <div id="successMessage" class="success-message">
                ✅ Submission added successfully!
            </div>
            <form id="submissionForm">
                <div class="form-group">
                    <label for="username">URL/Link</label>
                    <input type="url" id="username" name="username" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Describe this link..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Link</button>
            </form>
        </div>
        
        <!-- Submissions Display -->
        <div id="submissionsContainer">
            <div class="loading">Loading submissions...</div>
        </div>
    </div>

    <script>
        // Function to fetch and display submissions
        async function fetchSubmissions() {
            const container = document.getElementById('submissionsContainer');
            
            try {
                const response = await fetch('/api/submission');
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="no-submissions">📭 No submissions yet. Be the first to add one!</div>';
                    return;
                }
                
                // Display submissions
                let html = '<div class="submissions-grid">';
                data.forEach(sub => {
                    // Create clickable URL with proper protocol
                    let url = sub.url;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    
                    html += `
                        <div class="submission-card">
                            <div class="url">
                                <a href="${url}" target="_blank" rel="noopener noreferrer">
                                    ${sub.url}
                                </a>
                            </div>
                            <div class="description">${escapeHtml(sub.description)}</div>
                            <div class="timestamp">📅 ${formatDate(sub.timeStamp)}</div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error fetching submissions:', error);
                container.innerHTML = '<div class="no-submissions">❌ Error loading submissions. Please try again.</div>';
            }
        }
        
        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Helper function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Handle form submission
        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const description = document.getElementById('description').value;
            
            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: username,
                        description: description
                    })
                });
                
                if (response.ok) {
                    // Show success message
                    const successMsg = document.getElementById('successMessage');
                    successMsg.classList.add('show');
                    setTimeout(() => successMsg.classList.remove('show'), 3000);
                    
                    // Clear form
                    document.getElementById('username').value = '';
                    document.getElementById('description').value = '';
                    
                    // Refresh submissions
                    await fetchSubmissions();
                }
            } catch (error) {
                console.error('Error submitting:', error);
                alert('Failed to submit. Please try again.');
            }
        });
        
        // Load submissions when page loads
        document.addEventListener('DOMContentLoaded', fetchSubmissions);
        
        // Auto-refresh every 30 seconds
        setInterval(fetchSubmissions, 30000);
    </script>
</body>
</html>
